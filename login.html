<main><h1 class="sr">Masuk ke Jurnal Koneksi</h1>
<div class="logo-login"><img src="assets/logo.jpg" alt="Jurnal Koneksi" width="900" height="450"></div>
<div class="form">
  <input type="email" id="email" aria-label="Email" placeholder="nama@email.com" autocomplete="email">
  <input type="password" id="sandi" aria-label="Kata sandi" placeholder="Kata sandi (minimal 6 karakter)" autocomplete="current-password">
  <div class="galat" id="galat" role="alert"></div>
  <button class="btn" id="masuk">Masuk</button>
  <button class="btn garis" id="daftar">Daftar</button>
  <button class="btn garis" id="google">Lanjut dengan Google</button>
  <p class="hitung">Dengan mendaftar, kamu menyetujui <a href="aturan.html" style="text-decoration:underline">aturan &amp; kebijakan privasi</a>.</p>
</div><div id="tema" class="tema-pilih"></div></main>
