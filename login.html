<main><h1 class="sr" data-i="auth.h1">Masuk ke Jurnal Koneksi</h1>
<div class="logo-login"><img class="logo-terang" src="assets/logo.webp" alt="Jurnal Koneksi" width="900" height="450"><img class="logo-gelap" src="assets/logo-gelap.webp" alt="" aria-hidden="true" width="900" height="450"></div>
<div class="form">
  <input type="email" id="email" aria-label="Email" data-i-aria="auth.email" placeholder="nama@email.com" data-i-ph="auth.emailPh" autocomplete="email">
  <input type="password" id="sandi" aria-label="Kata sandi" data-i-aria="auth.sandi" placeholder="Kata sandi (minimal 8 karakter)" data-i-ph="auth.sandiPh" autocomplete="current-password">
  <div class="situs-jebakan" aria-hidden="true" style="position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden"><label>Situs web <input type="text" id="situs" name="situs" tabindex="-1" autocomplete="off"></label></div>
  <div id="captcha" style="min-height:0;display:flex;justify-content:center"></div>
  <div class="galat" id="galat" role="alert"></div>
  <button class="btn" id="masuk" data-i="auth.masuk">Masuk</button>
  <button class="btn garis" id="daftar" data-i="auth.daftar">Daftar</button>
  <p class="hitung" style="text-align:center"><a href="#" id="lupa" style="text-decoration:underline" data-i="auth.lupa">Lupa kata sandi?</a></p>
  <p class="hitung" data-i-html="auth.setujuHtml">Dengan mendaftar, kamu menyetujui <a href="ketentuan-layanan.html" style="text-decoration:underline">ketentuan layanan</a>, <a href="kebijakan-privasi.html" style="text-decoration:underline">kebijakan privasi</a>, dan <a href="aturan.html" style="text-decoration:underline">aturan</a>.</p>
