<title data-i-doc="chat.title">Chat · Jurkon</title></head><body data-tab="pesan">
<main><div class="header psn-kepala"><a class="psn-kembali" href="pesan.html" aria-label="← Pesan" data-i-aria="chat.kembali"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a><h1 id="lawan" class="psn-lawan"></h1></div>
<div class="chat" id="isi"></div></main>
<div class="kirim"><div>
  <p class="syarat-ikuti" id="syarat" role="status" hidden></p>
  <div class="psn-edit" id="editBar" hidden>
    <span class="psn-edit-isi"><b data-i="chat.mengedit">Mengedit pesan</b><small id="editCuplikan"></small></span>
    <button class="ikon-btn" id="editBatal" type="button" aria-label="Batal" data-i-aria="chat.batal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="rekam" id="rekam" hidden>
    <span class="titik"></span><span id="rekamWaktu">0:00</span><span class="info" data-i="chat.hilang10">Hilang otomatis setelah 10 menit</span>
    <button class="btn garis kecil" id="rekamBatal" type="button" data-i="chat.rekamBatal">Batal</button>
    <button class="btn kecil" id="rekamKirim" type="button" data-i="umum.kirim">Kirim</button>
  </div>
  <div class="psn-komposer" id="barisKirim">
    <div class="psn-pil">
      <span class="hitung" id="hitung"></span>
      <textarea id="teks" rows="1" aria-label="Tulis pesan" data-i-aria="chat.aria" placeholder="Tulis pesan..." data-i-ph="chat.ph"></textarea>
      <button class="ikon" id="btnFoto" type="button" hidden aria-label="Kirim foto" data-i-aria="chat.foto" title="Kirim foto" data-i-title="chat.foto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
      <input type="file" id="foto" accept="image/*" hidden>
      <button class="ikon" id="btnDok" type="button" hidden aria-label="Kirim dokumen" data-i-aria="chat.dokumen" title="Kirim dokumen" data-i-title="chat.dokumen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
      <input type="file" id="dok" accept=".pdf,.txt,.csv,.docx,.xlsx,.pptx" hidden>
      <button class="ikon" id="btnMik" type="button" hidden aria-label="Rekam pesan suara" data-i-aria="chat.suara" title="Rekam pesan suara" data-i-title="chat.suara"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    </div>
    <button class="psn-kirim" id="kirim" type="button" aria-label="Kirim" data-i-aria="umum.kirim"><svg class="naik" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg><svg class="cek" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
  </div>
</div></div>
