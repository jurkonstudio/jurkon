<!-- Gerbang akses: login, kode 2 langkah, atau akses ditolak. Diisi admin.js -->
<main id="gerbang" class="gerbang" hidden>
  <div class="gerbang-kartu" id="gerbangIsi"></div>
</main>

<!-- Aplikasi (hanya tampil bila admin terverifikasi) -->
<div class="app" id="app" hidden>
  <aside class="sisi">
    <a class="merek" href="#ringkasan" aria-label="Pusat Kendali Jurkon">
      <span class="merek-logo" aria-hidden="true">J</span>
      <span class="merek-teks"><b>Jurkon</b><small>Pusat Kendali</small></span>
    </a>
    <nav id="menu" class="menu" aria-label="Menu admin">
      <a href="#ringkasan" data-tab="ringkasan"><svg><use href="#i-ringkasan"/></svg><span>Ringkasan</span></a>
      <a href="#laporan" data-tab="laporan"><svg><use href="#i-laporan"/></svg><span>Laporan</span><b class="pil" id="lencanaLaporan" hidden></b></a>
      <a href="#pengguna" data-tab="pengguna"><svg><use href="#i-pengguna"/></svg><span>Pengguna</span></a>
      <a href="#posting" data-tab="posting"><svg><use href="#i-posting"/></svg><span>Posting</span></a>
      <a href="#sorotan" data-tab="sorotan"><svg><use href="#i-sorotan"/></svg><span>Sorotan</span></a>
      <a href="#situs" data-tab="situs"><svg><use href="#i-situs"/></svg><span>Situs</span></a>
      <a href="#admin" data-tab="admin"><svg><use href="#i-admin"/></svg><span>Akses admin</span></a>
      <a href="#keamanan" data-tab="keamanan"><svg><use href="#i-kunci"/></svg><span>Keamanan</span></a>
      <a href="#log" data-tab="log"><svg><use href="#i-log"/></svg><span>Jejak</span></a>
    </nav>
    <div class="sisi-bawah">
      <a href="/index.html"><svg><use href="#i-keluar"/></svg><span>Ke aplikasi</span></a>
      <a href="/landing.html" target="_blank" rel="noopener"><svg><use href="#i-luar"/></svg><span>Lihat landing</span></a>
    </div>
  </aside>

  <div class="utama">
    <header class="atas">
      <h1 id="judul">Ringkasan</h1>
      <div class="atas-aksi">
        <div id="aksiAtas" class="atas-halaman"></div>
        <button type="button" class="ikon" id="btnPalet" title="Cari perintah (Ctrl+K)" aria-label="Buka pencarian perintah"><svg><use href="#i-cari"/></svg><kbd>Ctrl K</kbd></button>
        <button type="button" class="ikon" id="btnSegar" title="Muat ulang data" aria-label="Muat ulang data"><svg><use href="#i-segar"/></svg></button>
        <button type="button" class="ikon" id="btnTema" title="Ganti tema" aria-label="Ganti tema"><svg><use href="#i-bulan"/></svg></button>
        <button type="button" class="ikon" id="btnKunci" title="Kunci layar" aria-label="Kunci layar"><svg><use href="#i-kunci"/></svg></button>
        <div class="akun">
          <button type="button" class="akun-tombol" id="btnAkun" aria-haspopup="true" aria-expanded="false"><span class="ava" id="avaSaya"></span><span class="akun-nama" id="namaSaya"></span></button>
          <div class="menu-akun" id="menuAkun" hidden>
            <div class="menu-akun-info"><b id="mAkunNama"></b><small id="mAkunEmail"></small></div>
            <button type="button" id="btnKeluar"><svg><use href="#i-keluar"/></svg>Keluar</button>
          </div>
        </div>
      </div>
    </header>
    <div id="isi" class="isi" tabindex="-1"><div class="kosong">Memuat…</div></div>
  </div>
</div>

<!-- Layar kunci (otomatis setelah tidak aktif) -->
<div id="kunci" class="kunci" hidden role="dialog" aria-modal="true" aria-labelledby="kunciJudul"></div>

<dialog id="dlg" class="dlg"></dialog>
<dialog id="palet" class="palet" aria-label="Pencarian perintah">
  <form method="dialog" class="palet-kotak">
    <div class="palet-cari"><svg><use href="#i-cari"/></svg><input type="text" id="paletIn" placeholder="Ke tab atau jalankan perintah…" autocomplete="off" spellcheck="false" aria-label="Cari perintah"><kbd>Esc</kbd></div>
    <ul id="paletDaftar" class="palet-daftar" role="listbox"></ul>
  </form>
</dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
