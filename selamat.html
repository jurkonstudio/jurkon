<title>Lengkapi profil · Jurkon</title></head><body>
<main><div class="header"><h1>Selamat datang</h1><span></span></div>
<div class="form">
  <p>Pilih username kamu. Username tampil di profil dan posting, jadi jangan memakai email atau data pribadi.</p>
  <label for="username">Username</label>
  <input type="text" id="username" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="20">
  <div class="hitung" id="infoUser">Huruf kecil, angka, dan garis bawah (_), 3-20 karakter.</div>
  <label for="nama">Nama tampilan (boleh dikosongkan)</label>
  <input type="text" id="nama" maxlength="40" autocomplete="off">
  <label class="centang"><input type="checkbox" id="setuju"> Saya menyetujui <a href="aturan.html" target="_blank" style="text-decoration:underline">aturan &amp; kebijakan privasi</a>.</label>
  <div class="galat" id="galat" role="alert"></div>
  <button class="btn" id="simpan">Mulai</button>
</div></main>
