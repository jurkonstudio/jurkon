<div class="form">

  <label for="username" data-i="pf.u.username">Username</label>
  <input type="text" id="username" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="20">

  <input type="text" id="nama" maxlength="40" autocomplete="off">
  <label class="centang"><input type="checkbox" id="setuju"><span data-i-html="sel.setujuHtml">Saya menyetujui <a href="aturan.html" target="_blank" style="text-decoration:underline">aturan &amp; kebijakan privasi</a>.</span></label>
  <div class="galat" id="galat" role="alert"></div>
  <button class="btn" id="simpan" data-i="sel.mulai">Mulai</button>
</div></main>
