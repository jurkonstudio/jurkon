<main><div class="header"><h1>Statistik</h1><a class="mulai-lewati" href="/">Beranda</a></div>
<div class="mulai stat-halaman">
  <p class="mulai-teks">Angka agregat tanpa data pribadi: tanpa cookie, IP, atau pelacak pihak ketiga. Khusus pengelola.</p>
  <div class="mulai-chip-baris" id="rentang" role="tablist">
    <button type="button" class="mulai-chip" data-h="7">7 hari</button>
    <button type="button" class="mulai-chip" data-h="30">30 hari</button>
    <button type="button" class="mulai-chip" data-h="90">90 hari</button>
  </div>
  <div class="galat" id="galat" role="alert"></div>
  <div id="ringkas" class="stat-kartu"></div>
  <h2>Per hari</h2><div class="stat-gulung" id="harian"></div>
  <h2>Kohort pendaftar</h2>
  <p class="mulai-teks">Aktif D1/D7: akun yang tercatat aktif lagi paling cepat 1 atau 7 hari setelah daftar (dari riwayat sesi). Kosong (-) berarti kohortnya belum cukup umur.</p>
  <div class="stat-gulung" id="kohort"></div>
</div></main>
